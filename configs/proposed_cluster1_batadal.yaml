config_version: 1
experiment_group: proposed_specialized_hierarchical
description: Proposed Cluster 1 BATADAL FCFL run using CNN1D-BN, FedBN, and weighted non-BN aggregation.
source_of_truth:
  architecture_contract: docs/ARCHITECTURE_CONTRACT.md
  data_contract: docs/DATA_CONTRACT.md
  dataset_note: docs/CLUSTER1_BATADAL_DATASET_NOTE.md
ledger:
  metadata_only: true
training_defaults:
  rounds: 50
  local_epochs: 1
  batch_size: 128
  seeds:
    - 42
    - 123
    - 2025
smoke_test_defaults:
  rounds: 2
  local_epochs: 1
  batch_size: 64
  seed: 42
clustering_defaults:
  method: AgglomerativeClustering
  linkage: ward
  metric: euclidean
  descriptor: batadal_group_mean_std_status_duty_cycle_attack_ratio
  reuse_frozen_memberships: true
clusters:
  - experiment_id: P_C1_BATADAL
    cluster_config: configs/cluster1_batadal.yaml
    hierarchy: hierarchical_fixed
    clustering_method: agglomerative
    n_subclusters: 2
    descriptor: batadal_group_mean_std_status_duty_cycle_attack_ratio
    membership_file: outputs_c1_batadal/clustering/cluster1_memberships.json
    model_family: cnn1d_bn
    fl_method: FedBN
    aggregation: weighted_non_bn_mean
    output_root: outputs_c1_batadal
    model_hyperparameters:
      channels: [32, 64, 64]
      kernel_sizes: [5, 3, 3]
      hidden_dim: 32
      dropout: 0.1
    training_hyperparameters:
      learning_rate: 0.003
      positive_class_weight_scale: 1.0
    calibration:
      output_root: outputs_c1_batadal/calibration
      threshold_selection_modes:
        - max_validation_f1
        - max_validation_f1_with_validation_fpr_le_0.10
        - max_validation_f1_with_validation_fpr_le_0.05
      positive_class_weight_scale_ablation: [0.25, 0.50, 1.00]
      threshold_selected_on: validation
      held_out_test_usage: final_evaluation_only
runtime_validation:
  require_cluster_configs_to_exist: true
  require_frozen_membership_files_before_training: true
  require_ledger_metadata_only: true
  require_batadal_cluster1_outputs: true
