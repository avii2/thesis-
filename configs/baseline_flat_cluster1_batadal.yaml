config_version: 1
experiment_group: baseline_flat
description: Cluster 1 BATADAL flat FedAvg baseline.
source_of_truth:
  architecture_contract: docs/ARCHITECTURE_CONTRACT.md
  data_contract: docs/DATA_CONTRACT.md
  dataset_note: docs/CLUSTER1_BATADAL_DATASET_NOTE.md
ledger:
  metadata_only: true
training_defaults:
  rounds: 50
  local_epochs: 1
  batch_size: 128
  seeds:
    - 42
    - 123
    - 2025
smoke_test_defaults:
  rounds: 2
  local_epochs: 1
  batch_size: 64
  seed: 42
clusters:
  - experiment_id: A_C1_BATADAL
    cluster_config: configs/cluster1_batadal.yaml
    hierarchy: flat
    clustering_method: none
    n_subclusters: 0
    descriptor: none
    model_family: cnn1d
    fl_method: FedAvg
    aggregation: weighted_arithmetic_mean
    output_root: outputs_c1_batadal
runtime_validation:
  require_cluster_configs_to_exist: true
  require_ledger_metadata_only: true
  require_batadal_cluster1_outputs: true
