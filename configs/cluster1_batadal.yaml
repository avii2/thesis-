config_version: 1
cluster:
  id: 1
  key: C1
  dataset_key: BATADAL
  dataset_name: BATADAL
  audit_report: outputs_c1_batadal/reports/data_profile_cluster1_batadal.json
data:
  data_root_env_var: FCFL_DATA_ROOT
  default_data_root: data
  current_raw_input_dir: data/raw/batadal
  current_raw_files:
    - training_dataset_1.csv
    - training_dataset_2.csv
    - test_dataset.csv
  batadal_output_root: outputs_c1_batadal
  training_input_mode: raw_csv_glob
  training_input_glob: data/raw/batadal/*.csv
  schema_consistent_across_files: true
  label_column: ATT_FLAG
  label_column_confirmed_from_audit: true
  candidate_label_columns_present:
    - ATT_FLAG
  timestamp_or_order_columns:
    - DATETIME
  excluded_columns:
    - ATT_FLAG
    - DATETIME
  exclude_if_present:
    - attack
    - Attack
    - label
    - Label
    - target
    - Target
    - timestamp
    - Timestamp
    - Time
    - date
    - Date
  missing_values_detected: false
  expected_telemetry_feature_count: 43
partitioning:
  candidate_leaf_clients: 12
  strategy: batadal_controlled_emulation
  validation_partitioning: chronological_contiguous
  test_partitioning: chronological_contiguous
clustering:
  fixed_subclusters: 2
  fixed_subcluster_ids:
    - H1
    - H2
  method: AgglomerativeClustering
  membership_file: outputs_c1_batadal/clustering/cluster1_memberships.json
  descriptor: batadal_group_mean_std_status_duty_cycle_attack_ratio
  include_attack_ratio_in_descriptor: true
preprocessing:
  input_type: multivariate_time_series
  window_length: 48
  stride: 1
  window_label_rule: last_row
  validation_cutoff: "2016-11-29 05:00"
  datetime_format: "%d/%m/%y %H"
experiment_defaults:
  active_experiment_ids:
    - A_C1_BATADAL
    - B_C1_BATADAL
    - P_C1_BATADAL
  proposed_model_family: cnn1d_bn
runtime_validation:
  require_training_input_to_exist: true
  require_schema_consistency_across_files: true
  require_label_column_to_exist: true
  error_on_missing_label_column: BATADAL_ATT_FLAG_MISSING
  require_raw_split_before_windowing: true
  require_last_row_window_label: true
  test_dataset_must_not_be_used_for_training_or_selection: true
