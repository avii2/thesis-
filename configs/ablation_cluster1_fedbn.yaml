config_version: 1
ablation_id: ablation_cluster1_fedavg_vs_fedbn
description: Required Cluster 1 FL-method ablation comparing hierarchical CNN1D-BN FedAvg against hierarchical CNN1D-BN FedBN.
source_of_truth:
  architecture_contract: docs/ARCHITECTURE_CONTRACT.md
  implementation_spec: docs/FCFL_IMPLEMENTATION_SPEC.md
  experiment_matrix: docs/EXPERIMENT_MATRIX.csv
training_defaults:
  rounds: 50
  local_epochs: 1
  batch_size: 128
  seeds:
    - 42
    - 123
    - 2025
smoke_test_defaults:
  rounds: 2
  local_epochs: 1
  batch_size: 64
  seed: 42
comparisons:
  - comparison_id: ablation_cluster1_fedavg_vs_fedbn
    title: Cluster 1 FedAvg vs FedBN
    control:
      experiment_id: AB_C1_FEDAVG_CNNBN
      run_source: custom_cluster1_fedavg_cnnbn
      label: FedAvg CNN1D-BN Control
      cluster_id: 1
      cluster_config: configs/cluster1_batadal.yaml
      membership_file: outputs_c1_batadal/clustering/cluster1_memberships.json
      hierarchy: hierarchical_fixed
      clustering_method: agglomerative
      n_subclusters: 2
      descriptor: batadal_group_mean_std_status_duty_cycle_attack_ratio
      model_family: cnn1d_bn
      fl_method: FedAvg
      aggregation: weighted_arithmetic_mean
      learning_rate: 0.003
    treatment:
      experiment_id: P_C1_BATADAL
      run_source: standard
      label: FedBN CNN1D-BN
runtime_validation:
  reuse_frozen_memberships: true
